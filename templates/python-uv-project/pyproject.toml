[project]
name = "python-app"
version = "0.1.0"
description = "Python project template"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
python-app = "python_app.main:main"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
